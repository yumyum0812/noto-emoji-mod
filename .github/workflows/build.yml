name: Build font

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-pip libcairo2-dev pkg-config zopfli pngquant
          pip install -r requirements.txt

      - name: Build font
        run: |
          nanoemoji colrv1/all.toml

      - name: Check artifacts
        run: |
          find -file -name "*.ttf"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NotoColorEmoji-ttf
          path: "**/*.ttf"

